[pytest]
pythonpath = .
testpaths = tests
addopts =
    --verbose
    --tb=short
    --strict-markers
asyncio_mode = auto
markers =
    unit: Unit tests
    integration: Integration tests
    api: API tests
    slow: Slow running tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning