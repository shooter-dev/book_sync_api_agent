name: Build and Deploy to Azure Container App

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'data_doc/**'
      - '*.md'
      - '.github/**'
      - '.dockerignore'
      - '.gitignore'
      - 'Makefile'
      - 'pytest.ini'

env:
  AZURE_CONTAINER_REGISTRY: booksyncrepo.azurecr.io
  IMAGE_NAME: api-booksync
  RESOURCE_GROUP: vplatevoetRG
  CONTAINER_APP: api-booksync

jobs:
  # Job 1 : Tests (s'exécute toujours)
  test:
    name: Tests et Qualité du Code
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code source
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configuration de Python 3.13
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      # 3. Installation des dépendances
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-asyncio pytest-cov
          pip install -r requirements.txt

      # 4. Linting avec flake8
      - name: Lint with flake8
        run: |
          # Arrête le build s'il y a des erreurs de syntaxe
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Autres erreurs = avertissements
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      # 5. Lancement des tests
      - name: Run tests with pytest
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term -v

      # 6. Upload du rapport de couverture
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # Job 2 : Build et Deploy Azure (ACTIVÉ)
  build-and-deploy:
    name: Build et Déploiement Azure
    runs-on: ubuntu-latest
    needs: test  # Ne s'exécute QUE si les tests passent
    if: github.ref == 'refs/heads/main'  # Seulement sur la branche main

    steps:
      # 1. Récupération du code source
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Connexion à Azure
      - name: Azure CLI login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3. Connexion à ACR
      - name: Docker login to ACR
        run: |
          az acr login --name booksyncrepo

      # 4. Build et Push de l'image Docker
      - name: Build and Push Docker image
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t $AZURE_CONTAINER_REGISTRY/$IMAGE_NAME:$IMAGE_TAG .
          docker push $AZURE_CONTAINER_REGISTRY/$IMAGE_NAME:$IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      # 5. Sauvegarde de l'image actuelle (pour rollback)
      - name: Sauvegarder l'image actuelle
        id: save-current
        run: |
          # Recupere l'image actuellement deployee avant la mise a jour
          CURRENT_IMAGE=$(az containerapp show \
            --name $CONTAINER_APP \
            --resource-group $RESOURCE_GROUP \
            --query "properties.template.containers[0].image" \
            --output tsv 2>/dev/null || echo "")

          if [ -n "$CURRENT_IMAGE" ]; then
            PREVIOUS_TAG=$(echo "$CURRENT_IMAGE" | sed 's/.*://')
            echo "Image precedente: $PREVIOUS_TAG"
            echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
          else
            echo "Aucune image precedente trouvee (premier deploiement)"
            echo "previous_tag=" >> $GITHUB_OUTPUT
          fi

      # 6. Mise a jour du Container App
      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name $CONTAINER_APP \
            --resource-group $RESOURCE_GROUP \
            --image $AZURE_CONTAINER_REGISTRY/$IMAGE_NAME:$IMAGE_TAG

      # 7. Attente du deploiement
      - name: Attente du deploiement
        run: |
          echo "Attente de 30 secondes pour le deploiement..."
          sleep 30

      # 8. Verification de sante post-deploiement
      - name: Health Check post-deploiement
        id: health-check
        run: |
          # Recupere l'URL de l'application
          APP_URL=$(az containerapp show \
            --name $CONTAINER_APP \
            --resource-group $RESOURCE_GROUP \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)

          HEALTH_URL="https://$APP_URL/predict/health"
          MAX_RETRIES=10
          RETRY_INTERVAL=15

          echo "URL de health check: $HEALTH_URL"

          # Boucle de verification avec retries
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Tentative $i/$MAX_RETRIES..."

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" --max-time 10 2>/dev/null || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "Application en bonne sante (HTTP $HTTP_CODE)"
              echo "status=success" >> $GITHUB_OUTPUT
              exit 0
            fi

            echo "Health check echoue (HTTP $HTTP_CODE), attente de ${RETRY_INTERVAL}s..."
            sleep $RETRY_INTERVAL
          done

          echo "L'application ne repond pas apres $MAX_RETRIES tentatives"
          echo "status=failure" >> $GITHUB_OUTPUT
          exit 1

      # 9. Rollback automatique en cas d'echec
      - name: Rollback automatique si echec
        if: failure() && steps.health-check.outputs.status == 'failure' && steps.save-current.outputs.previous_tag != ''
        run: |
          PREVIOUS_TAG="${{ steps.save-current.outputs.previous_tag }}"
          echo "::warning::Health check echoue - Rollback automatique vers $PREVIOUS_TAG"

          az containerapp update \
            --name $CONTAINER_APP \
            --resource-group $RESOURCE_GROUP \
            --image $AZURE_CONTAINER_REGISTRY/$IMAGE_NAME:$PREVIOUS_TAG

          echo "Rollback effectue vers: $PREVIOUS_TAG"

          # Verification du rollback
          sleep 30
          APP_URL=$(az containerapp show \
            --name $CONTAINER_APP \
            --resource-group $RESOURCE_GROUP \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://$APP_URL/predict/health" --max-time 10 2>/dev/null || echo "000")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "Rollback reussi - Application restauree"
          else
            echo "::error::Rollback echoue - Intervention manuelle requise"
            exit 1
          fi
