name: Build and Deploy to Azure Container App

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'data_doc/**'
      - '*.md'
      - '.github/**'
      - '.dockerignore'
      - '.gitignore'
      - 'Makefile'
      - 'pytest.ini'

env:
  AZURE_CONTAINER_REGISTRY: booksyncrepo.azurecr.io
  IMAGE_NAME: api-booksync
  RESOURCE_GROUP: vplatevoetRG
  CONTAINER_APP: api-booksync

jobs:
  # =============================================================================
  # JOB 1: TESTS AUTOMATISÉS
  # =============================================================================
  # Ce job exécute les tests unitaires avant le déploiement
  # Si les tests échouent, le déploiement est bloqué
  test:
    runs-on: ubuntu-latest

    steps:
      # Récupération du code source
      - name: Checkout code
        uses: actions/checkout@v4

      # Installation de Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Installation des dépendances
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Exécution des tests avec couverture
      - name: Run tests with coverage
        env:
          API_KEY: test-api-key-12345
          USE_AZURE_OPENAI: "false"
          TIMESCALE_SERVICE_URL: postgresql://test:test@localhost:5432/test
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=html --cov-fail-under=70

      # Upload du rapport de couverture
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  # =============================================================================
  # JOB 2: BUILD ET DÉPLOIEMENT
  # =============================================================================
  # Ce job ne s'exécute que si les tests passent (needs: test)
  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test  # Attend que les tests passent

    steps:
      # 1. Récupération du code source
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Connexion à Azure
      - name: Azure CLI login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3. Connexion à ACR
      - name: Docker login to ACR
        run: |
          az acr login --name booksyncrepo

      # 4. Build et Push de l'image Docker
      - name: Build and Push Docker image
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t $AZURE_CONTAINER_REGISTRY/$IMAGE_NAME:$IMAGE_TAG .
          docker push $AZURE_CONTAINER_REGISTRY/$IMAGE_NAME:$IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      # 5. Mise à jour du Container App
      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name $CONTAINER_APP \
            --resource-group $RESOURCE_GROUP \
            --image $AZURE_CONTAINER_REGISTRY/$IMAGE_NAME:$IMAGE_TAG
